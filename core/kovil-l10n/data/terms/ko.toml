# Terminology for Korean (ko). Researched 2026-11-13 by web research; native-speaker sign-off: pending.
# Evidence base: mostly third-party foreigner housing guides (seoulstart.com, kowork.kr, visainfo-korea.com, safehomes.kr, stay.enko.kr), Seoul city foreigner-lease PDF (global.seoul.go.kr), Incheon foreigner guide (incheon.go.kr), law.go.kr. No official Danuri/HiKorea housing page was retrieved; official confirmation is still needed for deadlines and the 체류지 변경신고 wording. Native-community evidence (Nepali/Vietnamese groups) was not found in search; confidence is lowered accordingly.

[[term]]
concept = "nationality"
ko = "국적"
use = "국적"
avoid = ["국가 (MT often gives 국가 for nationality, which reads as 'country of residence or origin in general')", "나라 (ambiguous: can mean country, and in speech it can sound like asking where you are from)", "출신 (means origin or hometown, not passport)"]
why = "국적 is the legal passport-country term used in ARC and immigration forms; MT's 국가 makes a form field read as a geography question rather than the passport nationality KOVIL needs."
register_note = "Use 국적 everywhere in forms and identity checks; it matches the 외국인등록증 field label."
sources = ["https://seoulstart.com/ko/guides/korea-housing-faq", "https://seoulstart.com/ko/guides/korea-housing-guide"]
confidence = "medium"

[[term]]
concept = "country"
ko = "국가"
use = "국가"
avoid = ["국적 (means passport country, wrong for a general 'country' field)", "나라 in formal UI (acceptable in speech, too casual for a form label)"]
why = "국가 is the neutral formal word for a country in general; using 국적 here would make a field ask for passport country instead of a place."
register_note = "In casual UI copy 나라 is natural; keep 국가 for forms and legal text."
sources = ["https://seoulstart.com/ko/guides/korea-housing-faq"]
confidence = "low"

[[term]]
concept = "housing_listing"
ko = "매물"
use = "매물"
avoid = ["상품 (reads as a shop product)", "리스팅 (English loanword, not used by Korean residents for property ads)", "집 광고 (sounds like an advert, not a listing)"]
why = "매물 is the standard term every Korean property app and broker uses for a property offered for sale or rent; MT's 상품 or 리스팅 sound unnatural to Korean users."
register_note = "Use 매물 as the noun; 올라온 매물 (listed property) is natural in UI copy."
sources = ["https://kowork.kr/blog/finding-a-house-in-korea", "https://stay.enko.kr/blog/how-to-find-housing-in-korea"]
confidence = "medium"

[[term]]
concept = "rental_request"
ko = "임대 요청"
use = "임대 요청"
avoid = ["구매 요청 (means buying)", "문의 (means a generic inquiry)"]
why = "Bundles errors_ko and notifications_ko already use 임대 요청 for this flow in every string, so the term is kept for consistency. The earlier 방 구하기 suggestion rested on one blog (kowork.kr) that was not re-verified on 2026-11-13 (search budget exhausted); native review may prefer 방 구하기 or 중개 의뢰 in speech."
register_note = "Keep 임대 요청 in UI and bundles. Native reviewer: if 방 구하기 is more natural, change all bundle strings together, not one at a time."
sources = ["https://kowork.kr/blog/finding-a-house-in-korea"]
confidence = "low"

[[term]]
concept = "security_deposit"
ko = "보증금"
use = "보증금"
avoid = ["예치금 (means escrow or deposit in a financial sense, not a rental deposit)", "담보금 (means collateral, a different legal concept)", "デポジット-style loanword 디파짓 (not used)"]
why = "보증금 is the universal legal term on every lease and in all official guides; alternatives like 예치금 suggest a financial account, not the amount returned at lease end."
register_note = "Always use 보증금 in legal text; 보증금 반환 (return of deposit) is the standard phrase for the end of a lease."
sources = ["https://seoulstart.com/ko/guides/korea-housing-guide", "https://global.seoul.go.kr/contents/bdmg/cont//1670834212972.pdf"]
confidence = "high"

[[term]]
concept = "jeonse"
ko = "전세"
use = "전세"
avoid = ["jeonse (romanization alone is not used by Korean residents in Korean text)", "전셋집 (means the property, not the lease type)", "lump-sum rent (MT literal translation, sounds like a fixed rent, misses the deposit-only structure)"]
why = "전세 is the legal term for a lump-sum deposit lease with no monthly rent; MT's 'lump-sum rent' suggests the tenant pays rent in one payment, which is wrong."
register_note = "Keep 전세 with a short gloss (보증금 목돈, 월세 없음) in UI; the romanized 'jeonse' is widely understood by foreigners and good as a keep-term."
sources = ["https://seoulstart.com/ko/guides/korea-housing-guide", "https://kowork.kr/blog/finding-a-house-in-korea"]
confidence = "high"

[[term]]
concept = "wolse"
ko = "월세"
use = "월세"
avoid = ["monthly rent without deposit context (MT often drops the 보증금 part)", "반전세 (a mixed form, do not use as a synonym)", "월임대 (not a standard term)"]
why = "월세 always means a deposit plus monthly rent; MT's bare 'monthly rent' hides the deposit, so foreigners underestimate the upfront cost."
register_note = "Use 보증금 + 월세 together in listings (예: 보증금 1000만원 / 월세 50만원)."
sources = ["https://seoulstart.com/ko/guides/korea-housing-guide", "https://kowork.kr/blog/finding-a-house-in-korea"]
confidence = "high"

[[term]]
concept = "monthly_rent"
ko = "월세(금액)"
use = "월세"
avoid = ["rent (MT ambiguous; can be read as total rent including 관리비)", "임대료 (formal term, sounds like a commercial lease)"]
why = "Residents quote the 월세 figure on its own, separate from 관리비; calling it 임대료 or 'rent' blurs the monthly charge with the building fee."
register_note = "Show 관리비 on its own line next to 월세."
sources = ["https://safehomes.kr/questions/첫-자취-월세와-관리비에-대해-1113"]
confidence = "medium"

[[term]]
concept = "maintenance_fee"
ko = "관리비"
use = "관리비"
avoid = ["maintenance (MT literal, sounds like repair)", "수리비 (repair cost, wrong)", "공과금 (utility bills, a different charge)"]
why = "관리비 is the monthly building fee for shared costs (경비, 청소, 공용 전기); MT's 'maintenance' suggests repairs and misleads renters about what they pay."
register_note = "Note which items it covers (공용 전기, 경비, 청소); 가스·수도·전기 are usually separate."
sources = ["https://safehomes.kr/questions/첫-자취-월세와-관리비에-대해-1113", "https://seoulstart.com/ko/guides/korea-housing-faq"]
confidence = "medium"

[[term]]
concept = "down_payment"
ko = "계약금"
use = "계약금"
avoid = ["down payment (MT literal, implies a mortgage-style initial payment)", "예약금 (booking deposit, a different and refundable concept in some contracts)", "착수금 (means a retainer, wrong)"]
why = "계약금 is the signing payment, usually about 10% of the deposit, and is forfeited if the tenant backs out; MT's 'down payment' suggests a loan structure and hides the forfeit risk."
register_note = "Use with 잔금 (balance paid on move-in day) when showing the payment schedule."
sources = ["https://visainfo-korea.com/entry/외국인-한국-전세-월세-계약-방법-총정리-2026", "https://seoulstart.com/ko/guides/buying-property-korea"]
confidence = "medium"

[[term]]
concept = "lease_contract"
ko = "임대차 계약"
use = "임대차 계약"
avoid = ["lease (MT gives 임대차 or 임대 계약, both fine; avoid 리스 which means equipment or car lease)", "임대 계약서 (sounds like a commercial real-estate lease)", "매매 계약 (means a sale, the wrong contract type)"]
why = "임대차 계약 is the legal name for a rental contract under 주택임대차보호법; 리스 or 매매 would send the user to the wrong contract type."
register_note = "Legal text: 임대차 계약서. Everyday UI: 계약서."
sources = ["https://seoulstart.com/ko/guides/korea-lease-documents-checklist", "https://global.seoul.go.kr/contents/bdmg/cont/1670834212982.pdf"]
confidence = "high"

[[term]]
concept = "landlord"
ko = "임대인"
use = "임대인 (집주인)"
avoid = ["landlord (MT literal, fine in English but a non-legal form)", "주인 (too informal, sounds like owner of anything)", "건물주 (means the building owner, may not be the lessor on the contract)"]
why = "임대인 is the legal party on the lease; 집주인 is the everyday word. Using 건물주 can be wrong because the person who signs the lease may not own the building (for example a sub-lessor)."
register_note = "Legal text: 임대인. Casual UI: 집주인."
sources = ["https://seoulhomes.kr/ko/properties/guide/leasing-to-expat-tenants/", "https://global.seoul.go.kr/contents/bdmg/cont/1670834212982.pdf"]
confidence = "high"

[[term]]
concept = "tenant"
ko = "임차인"
use = "임차인 (세입자)"
avoid = ["tenant (MT literal; English-only word, not used in Korean rental text)", "세입자 alone in legal text (acceptable in speech, too loose for a contract)", "입주자 (means a resident who has moved in, not the contracted tenant)"]
why = "임차인 is the legal party who pays under the lease; 입주자 would be wrong because it does not imply a contract, and MT's 'tenant' is not a Korean word."
register_note = "Legal: 임차인. Casual UI: 세입자."
sources = ["https://seoulhomes.kr/ko/properties/guide/leasing-to-expat-tenants/", "https://global.seoul.go.kr/contents/bdmg/cont/1670834212982.pdf"]
confidence = "high"

[[term]]
concept = "real_estate_agent"
ko = "공인중개사"
use = "공인중개사"
avoid = ["real estate agent (MT literal, fine in English but Koreans say 중개사 or 부동산)", "부동산 업자 (sounds like a dealer or a shady operator)", "브로커 (loanword, carries a scam-broker connotation for foreigners)"]
why = "공인중개사 is the licensed agent title; 부동산 업자 or 브로커 can suggest an unlicensed or risky person, which matters because only 공인중개사 can handle a lease legally."
register_note = "Use 공인중개사 for the licensed person; 중개사 is the short form in UI. Reviewer 2026-11-13: sources not re-fetched this pass (search budget exhausted)."
sources = ["https://yellowit.co.kr/%EC%A7%81%EC%9E%A5%EC%9D%B8-%EC%97%B0%EB%A7%90%EC%A0%95%EC%82%B0-%EA%B5%AD%EB%AF%BC%EB%82%B4%EC%9D%BC%EB%B0%B0%EC%9B%80%EC%B9%B4%EB%93%9C-%EB%85%B8%EB%8F%99%EB%B2%95/", "https://safehomes.kr/insights/pt-252-사회초년생을-위한-아주-쉬운-부동산-용어-정리"]
confidence = "medium"

[[term]]
concept = "brokerage_office"
ko = "중개사무소"
use = "부동산 (중개사무소)"
avoid = ["brokerage office (MT literal, Koreans never say this in speech)", "사무실 (means any office, too vague)", "중개소 (old and rare)"]
why = "Residents say 부동산 when they mean the agent shop; 중개사무소 is the formal name on the sign and in documents. MT's literal 'brokerage office' is unnatural."
register_note = "Use 부동산 in speech and UI, 중개사무소 on forms and legal text."
sources = ["https://safehomes.kr/insights/pt-252-사회초년생을-위한-아주-쉬운-부동산-용어-정리"]
confidence = "medium"

[[term]]
concept = "brokerage_fee"
ko = "중개수수료(복비)"
use = "중개수수료"
avoid = ["brokerage fee (MT literal, acceptable but unnatural)", "커미션 (loanword, not used for 중개 fee)", "복비 alone in legal or UI text (slang, may confuse foreigners who do not know it)"]
why = "중개수수료 is the legal name for the agent's fee; 복비 is slang but is what residents say. MT's 'commission' suggests a sales bonus and is not used for rentals."
register_note = "UI: 중개수수료. Speech: 복비 is common. Include the fee rate range in the UI if shown."
sources = ["https://yellowit.co.kr/%ec%a7%81%ec%9e%a5%ec%9d%b8-%ec%97%b0%eb%a7%90%ec%a0%95%ec%82%b0-%ea%b5%ad%eb%af%bc%eb%82%b4%ec%9d%bc%eb%b0%b0%ec%9b%80%ec%b9%b4%eb%93%9c-%eb%85%b8%eb%8f%99%eb%b2%95/%eb%b6%80%eb%8f%99%ec%82%b0-%ec%a4%91%ea%b0%9c%ec%88%98%ec%88%98%eb%a3%8c-%ea%b3%84%ec%82%b0-%eb%b0%8f-%ed%98%84%ea%b8%88%ec%98%81%ec%88%98%ec%a6%9d-%eb%b0%9c%ed%96%89%ea%b0%80%eb%8a%a5/", "https://seoulstart.com/ko/guides/real-estate-agent-fee-guide"]
confidence = "medium"

[[term]]
concept = "studio_one_room"
ko = "원룸"
use = "원룸"
avoid = ["studio (MT literal, Koreans say 원룸 and studio means a different thing in listings)", "one room (MT literal, sounds like a single room in a shared house)", "스튜디오 (loanword, not used for this housing type)"]
why = "원룸 is the standard listing term for a single-room flat with kitchen and bathroom; MT's 'studio' or 'one room' gives foreigners the wrong picture of shared or room-only housing."
register_note = "Keep 원룸 as a keep-term with gloss (1인 주거 공간, 주방·화장실 포함)."
sources = ["https://seoulstart.com/ko/guides/korea-apartment-types", "https://seoulstart.com/ko/guides/goshiwon-vs-officetel-vs-oneroom"]
confidence = "high"

[[term]]
concept = "officetel"
ko = "오피스텔"
use = "오피스텔"
avoid = ["officetel (romanization fine as keep-term, but not MT's offices-plus-hotel gloss)", "사무실 (means an office, misleads users into thinking it is a work-only unit)", "레지던스 (loanword for serviced apartments, a different product)"]
why = "오피스텔 is a mixed office-residence building; many are registered as 업무시설 and may not allow 전입신고, which is the risk MT's office-gloss hides."
register_note = "Keep 오피스텔 and add a gloss (업무·주거 겸용, 주소 신고 가능 여부 확인)."
sources = ["https://seoulstart.com/ko/guides/goshiwon-vs-officetel-vs-oneroom", "https://seoulstart.com/ko/guides/korea-apartment-types"]
confidence = "medium"

[[term]]
concept = "gosiwon"
ko = "고시원"
use = "고시원"
avoid = ["gosiwon (romanization is fine as keep-term, but MT gives 'study room' or 'examination institute' which is wrong)", "고시 공부방 (means study room, the historical name for exam prep rooms, misleading)", "dormitory (MT literal; implies school or shared-bed housing)"]
why = "고시원 is a small single-room unit with shared bathroom and very low deposit, used as a short-term or budget option; 'dormitory' or 'study room' makes it sound like school housing."
register_note = "Keep 고시원 with gloss (소형 방, 공용 화장실·주방)."
sources = ["https://seoulstart.com/ko/guides/goshiwon-vs-officetel-vs-oneroom", "https://gobang.kr/contents/7493"]
confidence = "medium"

[[term]]
concept = "semi_basement"
ko = "반지하"
use = "반지하"
avoid = ["semi-basement (MT literal, English term not used by residents)", "basement (MT often gives 지하, which is a full underground unit and misleads about light and humidity)", "지하방 (means a full basement unit, different risk level)"]
why = "반지하 means the unit is half underground, with partial window light and humidity risk; MT's 'basement' suggests full underground, which is worse."
register_note = "Keep 반지하 with a gloss (창문이 지면 가까이, 습기·채광 주의)."
sources = ["https://seoulstart.com/ko/guides/korea-apartment-types", "https://kowork.kr/blog/finding-a-house-in-korea"]
confidence = "medium"

[[term]]
concept = "move_in_report"
ko = "전입신고"
use = "전입신고 (외국인등록자는 체류지 변경신고)"
avoid = ["move-in report (MT literal, residents never use it)", "주소 이전 (vague, not the legal term)", "이사 신고 (reads as a moving-company or general notice, not the official registration)"]
why = "전입신고 is the legal address registration (주민등록법); registered foreigners file 체류지 변경신고 under 출입국관리법 instead, so MT's literal 'move-in report' points foreigners at the wrong form. 주민센터 also accepts 체류지 변경신고, so the office is not the problem; the form name is."
register_note = "Registered foreigners: say 체류지 변경신고 first. Deadline 15 days after the move (등록외국인): seoulstart housing guide (fetched 2026-11-13) and a 영등포구청 guide summary (search snippet, page not fetched) both cite 출입국관리법 제36조; the same guide says 14 days applies to 외국국적동포, which is why private sites say 14. Statute text is still not read (law.go.kr returned maintenance pages), so do not show the number in UI until 출입국관리법 제36조 or 하이코리아 is checked."
sources = ["https://seoulstart.com/ko/guides/korea-housing-faq", "https://seoulstart.com/ko/guides/korea-jeonse-loan-guide", "https://www.law.go.kr/LSW/flDownload.do?flSeq=151063705"]
confidence = "low"

[[term]]
concept = "fixed_date_stamp"
ko = "확정일자"
use = "확정일자"
avoid = ["fixed date (MT literal, loses the legal meaning)", "날짜 도장 (plain description, correct but not the legal term)", "계약 확인 날짜 (vague, not what the stamp does)"]
why = "확정일자 is the legal date stamp that gives priority repayment in an auction; MT's 'fixed date' says nothing about deposit protection, so foreigners skip it."
register_note = "Keep 확정일자 and add the gloss (보증금 우선변제권을 위한 날짜 도장)."
sources = ["https://seoulstart.com/ko/guides/korea-housing-faq", "https://seoulstart.com/ko/guides/korea-housing-guide"]
confidence = "high"

[[term]]
concept = "property_register"
ko = "등기부등본"
use = "등기부등본"
avoid = ["property register (MT literal, correct gloss but not the term residents use)", "land register (wrong, 토지 대장 is a different document)", "건축물대장 (building ledger, a different document)"]
why = "등기부등본 is the title and debt record that foreigners must check before signing; MT's 'property register' is vague, and 건축물대장 is a different document that users might fetch by mistake."
register_note = "Keep 등기부등본 with gloss (소유권·근저당 등 권리 관계 기록)."
sources = ["https://seoulstart.com/ko/guides/korea-housing-guide", "https://visainfo-korea.com/entry/외국인-한국-전세-월세-계약-방법-총정리-2026"]
confidence = "high"

[[term]]
concept = "arc"
ko = "외국인등록증"
use = "외국인등록증"
avoid = ["ARC as the only label (fine as a gloss: 법무부 guidance since 2025 uses both 외국인등록증 and Residence Card; the printed card says 외국인등록증)", "외국등록증 (old wording, may confuse)", "외국인 등록번호 (the number, not the card)"]
why = "외국인등록증 is the card name printed on the document (checked 2026-11-13 on a visa guide: front shows 사진·이름·국적·체류자격·체류기간). Officials and forms use it; 'ARC' is understood by many foreigners but is not the Korean label."
register_note = "Use 외국인등록증 on forms. Keep ARC as a parenthetical gloss only for foreigners who know the English term."
sources = ["https://visainfo-korea.com/entry/외국인등록증-발급-방법-완벽-가이드신규-발급-대상·서류·절차·기간·수수료-2026-최신-업데이트", "https://internationalcenter.inha.ac.kr/bbs/internationalcenter/2507/148961/artclView.do"]
confidence = "high"

[[term]]
concept = "visa_status"
ko = "체류자격"
use = "체류자격"
avoid = ["visa status (MT literal, the Korean term refers to the category, not the visa sticker)", "비자 (general word, means the visa document, not the legal status category)", "비자 종류 (vague)"]
why = "체류자격 is the legal category (D-2 student, E-9 non-professional worker) on the ARC; MT's 'visa status' or 'visa' hides that the code letters are the category users must enter."
register_note = "Show codes with gloss: D-2 (유학), E-9 (비전문취업). Keep codes unchanged."
sources = ["https://internationalcenter.inha.ac.kr/bbs/internationalcenter/2507/148961/artclView.do", "https://kli.catholic.ac.kr/_res/cuk/kli/etc/guide.pdf"]
confidence = "high"

[[term]]
concept = "identity_verification"
ko = "외국인 인증 / 본인 인증"
use = "외국인 인증 (외국인등록증 기반 본인 인증)"
avoid = ["identity verification (MT literal, sounds like a bank KYC step)", "신원 확인 (formal, sounds like police check)", "본인 인증 alone (generic, does not signal the foreigner ARC step)"]
