why = "මෙට්‍රෝ මාරුව means switching metro lines at a station; 'bus stop' is a different thing and would send the user to the wrong place."
register_note = "Everyday."
sources = ["https://seoulstart.com/guides/korea-housing-guide"]
confidence = "low"

[[term]]
concept = "community_center"
ko = "주민센터"
use = "jumin center (ජුමින් සෙන්ටර්) - ප්‍රාදේශීය රජයේ කාර්යාලය"
avoid = ["ප්‍රජා ශාලාව (community hall)"]
why = "Keep the Korean name romanized with gloss; 'community hall' suggests a social venue, but the building is the government ward office where move-in reports are filed."
register_note = "Keep romanization; gloss as the local government office."
