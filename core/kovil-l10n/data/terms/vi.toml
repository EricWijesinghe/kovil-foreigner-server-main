use = "phường (동)"
avoid = ["xã", "khu phố"]
why = "'xã' means a rural commune and sounds wrong for Seoul neighborhoods, and 'khu phố' is vague."
register_note = "Keep the Korean name in addresses: 'Hapjeong-dong (phường Hapjeong)'."
