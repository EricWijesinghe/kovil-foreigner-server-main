ko = "구/시군구"
use = "quận (구)"
avoid = ["huyện", "khu"]
why = "Korean 구 is a city district, which Vietnamese readers call 'quận'; 'huyện' means county (Korean 군), so it mislabels Seoul's districts, and 'khu' is vague."
register_note = "For 시/군 use 'thành phố'/'huyện' respectively."
