use = "đối tác môi giới"
avoid = ["bạn đời", "cộng sự", "partner"]
why = "'bạn đời' means spouse or romantic partner and 'cộng sự' means co-worker, so either makes a KOVIL broker sound like a personal relationship or a colleague."
register_note = "Use 'đối tác' in UI and keep 'môi giới' for the role."
sources = []
