[[term]]
concept = "subway_transfer"
ko = "환승"
use = "chuyển tuyến"
avoid = ["quá cảnh", "chuyển tiếp", "đổi xe"]
why = "'quá cảnh' means transit through a country, a travel term, and 'đổi xe' suggests changing vehicles rather than metro lines."
