[[term]]
concept = "district"
ko = "구/시군구"
use = "เขต (กู)"
avoid = ["อำเภอ", "จังหวัด"]
why = "เขต with the romanized 구 names a Seoul-style district; อำเภอ (district in Thailand) and จังหวัด (province) are Thai administrative units that would mislead about the level."
