[[term]]
concept = "neighborhood"
ko = "동/읍면동"
use = "ตง (dong: ชุมชนระดับย่อยในเขต)"
avoid = ["ตำบล", "หมู่บ้าน"]
why = "ตง (romanized 동) names the Korean neighborhood unit; ตำบล (Thai subdistrict) and หมู่บ้าน (village) are different administrative levels."
register_note = "No Thai source found; keep the romanization with a gloss."
sources = []
confidence = "low"

[[term]]
concept = "subway_transfer"
ko = "환승"
use = "เปลี่ยนสาย"
