[[term]]
concept = "report_content"
ko = "신고"
use = "รายงานเนื้อหา"
avoid = ["ร้องเรียน", "แจ้งความ"]
why = "รายงานเนื้อหา is the in-app flag action; ร้องเรียน (formal complaint) and แจ้งความ (file a police report) are much heavier actions."
register_note = "No Thai source found; generic UI phrasing."
sources = []
confidence = "low"

[[term]]
concept = "push_notification"
ko = "푸시 알림"
use = "การแจ้งเตือน"
avoid = ["การผลักดัน", "ข้อความดัน"]
why = "การแจ้งเตือน is the standard Thai app term for a notification; แปลตรงจากคำว่า push (การผลักดัน) reads as pushing something, not alerting the user."
register_note = "Standard UI word."
sources = []
