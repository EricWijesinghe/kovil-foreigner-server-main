[package]
name = "kovil-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "KOVIL API server (Rust rewrite of the Spring Boot app). Same MySQL schema and JSON contract."

[dependencies]
kovil-l10n = { path = "../kovil-l10n" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa", "rust_decimal", "derive"] }
rust_decimal = { version = "1.43.0", features = ["serde-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
base64 = "0.22"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
