# 배포(QA·운영) 프로파일 — dev와의 차이는 셋뿐이다:
#   ① SQL 로그 끔(dev의 show_sql은 배포 로그를 잠식한다)
#   ② Redis database 인덱스 분리(QA는 다른 제품과 Redis를 공유한다 — HUMAN_TODO #25.
#      billigo가 0을 쓰므로 QA .env는 REDIS_DATABASE=1로 격리한다)
#   ③ DB 포트 파라미터화(도커 네트워크 밖 DB로 옮길 때 코드 수정 없이 전환)
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 인증된 모든 요청이 Redis 를 한 번 탄다(토큰 취소 검사). 기본값(60초)이면 Valkey 가
      # 블랙홀이 되는 순간 톰캣 스레드가 60초씩 묶여 서버가 통째로 멈춘다 —
      # 같은 VPC 라 정상 지연은 수 ms 다. 빨리 포기하고 fail-open 으로 넘긴다.
      timeout: 500ms
      connect-timeout: 500ms
      database: ${REDIS_DATABASE:0}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kovil}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
