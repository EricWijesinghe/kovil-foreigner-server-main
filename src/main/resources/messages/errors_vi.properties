PARTNER_REVIEW_NO_CHANGE=Không có nội dung cần xét duyệt lại nào thay đổi. Để chỉ đổi số điện thoại đại diện của văn phòng, vui lòng dùng chức năng đổi số điện thoại.
PARTNER_DIVISION_CHANGED=Hồ sơ đã thay đổi kể từ khi bạn mở xem. Vui lòng tải lại và xem xét lại.
PARTNER_SUSPENDED_CANNOT_WITHDRAW=Đối tác có bộ phận đang bị tạm khóa không thể xóa tài khoản. Vui lòng liên hệ bộ phận hỗ trợ.
OFFICE_CHANGE_REQUEST_NOT_FOUND=Không tìm thấy yêu cầu thay đổi thông tin văn phòng.
OFFICE_CHANGE_REQUEST_CHANGED=Yêu cầu này đã được cập nhật sau khi bạn mở xem. Vui lòng tải lại và xem lại.
OFFICE_CHANGE_REQUEST_NOT_REVIEWABLE=Chỉ yêu cầu thay đổi đang chờ mới có thể phê duyệt hoặc từ chối.
OFFICE_CHANGE_DIVISION_NOT_APPROVED=Chỉ có thể phê duyệt thay đổi văn phòng khi bộ phận môi giới đã được phê duyệt.
OFFICE_CHANGE_NOT_PENDING=Hiện không có yêu cầu thay đổi nào đang chờ.

LISTING_REPORT_REASON_REQUIRED=Vui lòng chọn lý do báo cáo.
LISTING_REPORT_DUPLICATE=Bạn đã báo cáo tin đăng này rồi.
LISTING_REPORT_NOT_FOUND=Không tìm thấy báo cáo.
LISTING_REPORT_ALREADY_HANDLED=Báo cáo này đã được xử lý.
LISTING_NOT_BLOCKED=Tin đăng này chưa bị chặn.
LISTING_NOT_BLOCKABLE=Tin đăng này đã bị chặn hoặc đã kết thúc.
LISTING_NOT_RESERVED=Tin đăng này chưa được đánh dấu là đã giữ chỗ.
