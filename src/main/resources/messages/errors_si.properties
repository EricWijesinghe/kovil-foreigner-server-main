FILE_NOT_FOUND=ගොනුව සොයා ගත නොහැකි විය.
STORAGE_UNAVAILABLE=ගොනු ගබඩාව තාවකාලිකව ලබා ගත නොහැක. කරුණාකර ඉක්මනින් නැවත උත්සාහ කරන්න.

RESIDENT_STATUS_NOT_FOUND=මෙම පදිංචි තත්ත්වය තේරිය නොහැක.
VERIFICATION_REQUIREMENTS_NOT_READY=මෙම පදිංචි තත්ත්වය සඳහා ලේඛන අවශ්‍යතා තවම සූදානම් නැත. කරුණාකර පසුව නැවත උත්සාහ කරන්න.

VERIFICATION_PENDING=ඔබේ අයදුම්පත සමාලෝචනය වෙමින් පවතී. කරුණාකර ප්‍රතිඵලය සඳහා රැඳී සිටින්න.
VERIFICATION_DOCS_MISSING=අවශ්‍ය ලේඛන අඩුයි.
VERIFICATION_DOC_NOT_REQUIRED=ඔබ ඉදිරිපත් කළ ලේඛනයක් ඉල්ලා නොතිබුණි.
VERIFICATION_DOC_TOO_MANY=මෙම ලේඛනය සඳහා ගොනු ගණන වැඩියි.
VERIFICATION_FILE_INVALID=මෙම ගොනුව භාවිතා කළ නොහැක. කරුණාකර නැවත උඩුගත කරන්න.
VERIFICATION_NOT_FOUND=ඔබ තවම සත්‍යාපනය සඳහා අයදුම් කර නැත.
VERIFICATION_NOT_PENDING=මෙම අයදුම්පත දැනටමත් සමාලෝචනය කර ඇත.
REJECT_REASON_REQUIRED=ප්‍රතික්ෂේප කිරීමේ හේතුව ඇතුළත් කරන්න.
VERIFICATION_EXPIRY_IN_PAST=කල් ඉකුත් වන දිනය අද දිනට හෝ ඊට පසු විය යුතුය.

VERIFICATION_REQUIRED=කුලී ඉල්ලීමක් කිරීමට පෙර විදේශිකයෙකු ලෙස සත්‍යාපනය අවශ්‍යයි.
RENTAL_REQUEST_NOT_FOUND=කුලී ඉල්ලීම සොයා ගත නොහැකි විය.
REQUEST_NOT_EDITABLE=මෙම ඉල්ලීම දැන් වෙනස් කළ නොහැක.
RENTAL_REQUEST_LIMIT_EXCEEDED=ඔබට දැනටමත් ක්‍රියාත්මක කුලී ඉල්ලීමක් ඇත.
REGION_REQUIRED=අවම වශයෙන් එක් ප්‍රදේශයක් තෝරන්න.
REGION_INVALID_LEVEL=පළාතක් නොව දිස්ත්‍රික්කයක් තෝරන්න.
REGION_NOT_FOUND=එම ප්‍රදේශය ලබා ගත නොහැක.
OPTION_NOT_FOUND=එම විකල්පය ලබා ගත නොහැක.
OPTION_SELECTION_INVALID=මෙම කණ්ඩායමෙන් එක් තේරීමක් පමණක් අනුමත වේ.
OPTION_ANSWER_REQUIRED=කරුණාකර මෙම ප්‍රශ්නයට පිළිතුරු දෙන්න.
OPTION_EXTRA_REQUIRED=කරුණාකර අතිරේක ක්ෂේත්‍රය පුරවන්න.
OPTION_EXTRA_INVALID=අතිරේක ක්ෂේත්‍රයේ අගය වලංගු නොවේ.
OPTION_DATE_IN_PAST=මෙම ප්‍රශ්නය සඳහා අතීත දින තේරිය නොහැක.
OPTION_CONDITION_INVALID=කොන්දේසි සහිත ප්‍රශ්නයක් තවත් කොන්දේසි සහිත ප්‍රශ්නයක් මත රඳා තිබිය නොහැක.
BUDGET_RANGE_INVALID=අවම අගය උපරිම අගයට වඩා වැඩි විය නොහැක.
MOVE_IN_DATE_IN_PAST=ඇතුළුවීමේ දිනය අද දිනට හෝ ඊට පසු විය යුතුය.

REQUEST_NOT_OPEN=මෙම ඉල්ලීම දැනටමත් සකස් කෙරෙමින් හෝ වසා ඇත.
RENTAL_REQUEST_ALREADY_CLAIMED=වෙනත් කාර්යාලයක් දැනටමත් මෙම ඉල්ලීම ගෙන ඇත.
RENTAL_REQUEST_CLAIM_LIMIT=ඔබේ කාර්යාලය ක්‍රියාත්මක ඉල්ලීම් ගණන සීමාවට ළඟා වී ඇත. පළමුව ඉල්ලීමක් වසන්න හෝ නිදහස් කරන්න.
RENTAL_REQUEST_NOT_IN_PROGRESS=මෙම ඉල්ලීම තවදුරටත් ක්‍රියාත්මක නොවේ.
RENTAL_REQUEST_OUTCOME_REQUIRED=ඉල්ලීම අවසන් වූ ආකාරය තෝරන්න.
RENTAL_REQUEST_OFFICE_NOT_ACTIVE=ඔබේ කාර්යාලයට කුලී ඉල්ලීම් සකස් කිරීමට අනුමැතිය නැත.

OCR_NO_FILE=කුලී ගිවිසුමේ අවම වශයෙන් එක් පිටුවක් අමුණන්න.
OCR_TOO_MANY_PAGES=පිටු ගණන වැඩියි.
OCR_FILE_TOO_LARGE=ගොනුව ඉතා විශාලයි.
OCR_UNSUPPORTED_FILE_TYPE=එම ගොනු වර්ගයට සහාය නොදක්වයි.
OCR_PROVIDER_ERROR=ලේඛනය කියවිය නොහැකි විය. කරුණාකර තොරතුරු අතින් ඇතුළත් කරන්න.
LLM_PROVIDER_ERROR=ලේඛනය විශ්ලේෂණය කළ නොහැකි විය. කරුණාකර තොරතුරු අතින් ඇතුළත් කරන්න.
LLM_RESPONSE_UNPARSABLE=විශ්ලේෂණ ප්‍රතිඵලය කියවිය නොහැකි විය. කරුණාකර තොරතුරු අතින් ඇතුළත් කරන්න.

OCR_UNAUTHORIZED=ලේඛන කියවීම දැනට ලබා ගත නොහැක.
LLM_UNAUTHORIZED=ලේඛන විශ්ලේෂණය දැනට ලබා ගත නොහැක.
LLM_RATE_LIMITED=දැනට විශ්ලේෂණ ගණන වැඩියි. පසුව නැවත උත්සාහ කරන්න හෝ තොරතුරු අතින් ඇතුළත් කරන්න.

NOTIFICATION_NOT_FOUND=දැනුම්දීම සොයා ගත නොහැකි විය.
NOTIFICATION_NOT_RETRYABLE=මෙම දැනුම්දීම දැනටමත් සකස් කර ඇත.
NOTIFICATION_CATEGORY_NOT_TOGGLEABLE=මෙම දැනුම්දීම් වර්ගය ක්‍රියාවිරහිත කළ නොහැක.

CATEGORY_NOT_FOUND=එම පුවරුව ලබා ගත නොහැක.
CATEGORY_HAS_POSTS=පෝස්ට් ඇති පුවරුවක අනාමිකභාවය වෙනස් කළ නොහැක.
POST_NOT_FOUND=පෝස්ට් සොයා ගත නොහැකි විය.
POST_TITLE_REQUIRED=මාතෘකාව ඇතුළත් කරන්න (අක්ෂර 150 දක්වා).
POST_BODY_REQUIRED=අන්තර්ගතය ඇතුළත් කරන්න (අක්ෂර 5000 දක්වා).
NOT_CONTENT_OWNER=කතුවරයාට පමණක් මෙය කළ හැක.
TAG_LIMIT_EXCEEDED=ටැග් 10 ක් දක්වා එකතු කළ හැක.
TAG_INVALID=සෑම ටැගයකම අක්ෂර 1-20 ක් විය යුතුය.
TAG_BANNED=එම ටැගය භාවිතා කළ නොහැක.
IMAGE_LIMIT_EXCEEDED=ඡායාරූප 5 ක් දක්වා අමුණා ගත හැක.
COMMENT_NOT_FOUND=අදහස සොයා ගත නොහැකි විය.
COMMENT_BODY_REQUIRED=අදහස ඇතුළත් කරන්න (අක්ෂර 1000 දක්වා).
COMMENT_DEPTH_EXCEEDED=පිළිතුරකට පිළිතුරු දීමට ඉඩ නැත.
COMMENT_PARENT_MISMATCH=එම අදහස වෙනත් පෝස්ට් එකකට අයත් වේ.
REPORT_REASON_REQUIRED=හේතුවක් තෝරන්න.
REPORT_DUPLICATE=ඔබ මෙය දැනටමත් වාර්තා කර ඇත.
REPORT_NOT_FOUND=වාර්තාව සොයා ගත නොහැකි විය.
REPORT_ALREADY_HANDLED=මෙම වාර්තාව දැනටමත් සකස් කර ඇත.
SELF_BLOCK=ඔබම අවහිර කළ නොහැක.
USER_SUSPENDED=ඔබේ ගිණුම අත්හිටුවා ඇත. කරුණාකර පාරිභෝගික සහාය අමතන්න.
