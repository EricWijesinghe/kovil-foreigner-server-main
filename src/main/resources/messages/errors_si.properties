PARTNER_DIVISION_CHANGED=ඔබ මෙය විවෘත කළ පසු අයදුම්පත වෙනස් වී ඇත. නැවත පූරණය කර නැවත සමාලෝචනය කරන්න.
PARTNER_SUSPENDED_CANNOT_WITHDRAW=අත්හිටුවූ අංශයක් ඇති හවුල්කරුවෙකුට ඉවත් වීමට නොහැක. කරුණාකර පාරිභෝගික සහාය අමතන්න.
OFFICE_CHANGE_REQUEST_NOT_FOUND=කාර්යාල වෙනස් කිරීමේ ඉල්ලීම සොයා ගත නොහැකි විය.
OFFICE_CHANGE_REQUEST_CHANGED=ඔබ මෙය විවෘත කළ පසු මෙම වෙනස් කිරීමේ ඉල්ලීම වෙනස් වී ඇත. නැවත පූරණය කර නැවත සමාලෝචනය කරන්න.
OFFICE_CHANGE_REQUEST_NOT_REVIEWABLE=බලාපොරොත්තුවෙන් ඇති වෙනස් කිරීමේ ඉල්ලීමක් පමණක් අනුමත හෝ ප්‍රතික්ෂේප කළ හැක.
OFFICE_CHANGE_DIVISION_NOT_APPROVED=බ්‍රෝකර් අංශය අනුමත වී ඇති විට පමණක් කාර්යාල වෙනස අනුමත කළ හැක.
OFFICE_CHANGE_NOT_PENDING=බලාපොරොත්තුවෙන් ඇති වෙනස් කිරීමේ ඉල්ලීමක් නැත.


LISTING_REPORT_REASON_REQUIRED=වාර්තාව සඳහා හේතුවක් තෝරන්න.
LISTING_REPORT_DUPLICATE=ඔබ මෙම දැන්වීම දැනටමත් වාර්තා කර ඇත.
LISTING_REPORT_NOT_FOUND=වාර්තාව සොයා ගත නොහැකි විය.
LISTING_REPORT_ALREADY_HANDLED=මෙම වාර්තාව දැනටමත් සකස් කර ඇත.
LISTING_NOT_BLOCKED=මෙම දැන්වීම අවහිර කර නැත.
LISTING_NOT_BLOCKABLE=මෙම දැන්වීම දැනටමත් අවහිර කර ඇත හෝ අවසන් වී ඇත.
LISTING_NOT_RESERVED=මෙම දැන්වීම වෙන්කර ඇති ලෙස සලකුණු කර නැත.
