# 알림 문구. **문구 정본은 여기다** — DB에는 template_code와 params만 남는다(FR-603).
# 유저가 언어를 바꾸면 과거 알림도 그 언어로 다시 렌더된다.
# 키 규약: <noti_type 소문자>.title / .body

# MessageFormat 에서 홑따옴표는 인용 토글이다 — 이스케이프하지 않으면 그 뒤의 {1}이
# 리터럴로 발송된다(실사고 위험: "rent of KRW {1}" 이 그대로 나감, 적대적 리뷰 2026-09-02).

