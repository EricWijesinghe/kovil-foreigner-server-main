LISTING_POLYGON_INVALID=Сызылған аймақ жарамсыз. Қайтадан сызыңыз.
LISTING_POLYGON_TOO_LARGE=Сызылған аймақ тым үлкен. Кішірек аймақ сызыңыз.
SAVED_AREA_NOT_FOUND=Сақталған аймақ табылмады.
SAVED_AREA_LIMIT_EXCEEDED=20 аймаққа дейін сақтауға болады. Алдымен бірін жойыңыз.
PUBLISH_REGION_REQUIRED=Жариялаудан бұрын қызмет аймағы ішінен ауданды таңдаңыз.

# ── 파트너 · 부문 심사 ──
NOT_A_PARTNER=Бұл аккаунт серіктес аккаунты емес.
PARTNER_DIVISION_NOT_FOUND=Серіктес бөлімі табылмады.
PARTNER_DIVISION_NOT_EDITABLE=Тоқтатылған бөлімді қайта жіберу мүмкін емес.
PARTNER_DIVISION_NOT_REVIEWABLE=Тек қаралуды күтіп тұрған жіберілген бөлімді ғана мақұлдауға немесе қабылдамауға болады.
PARTNER_DIVISION_NOT_APPROVED=Тек мақұлданған бөлімді ғана тоқтатуға болады.
PARTNER_DIVISION_NOT_SUSPENDED=Тек тоқтатылған бөлімді ғана қайта іске қосуға болады.
PARTNER_NOT_ACTIVE=Бұл серіктес аккаунты тоқтатылған немесе жабылған.
PARTNER_LICENSE_FILE_INVALID=Тіркеу куәлігінің файлын тіркеу мүмкін емес.
PARTNER_REVIEW_NO_CHANGE=Қарауды талап ететін ештеңе өзгерген жоқ. Тек кеңсе телефонын өзгерту үшін телефон өзгерту функциясын пайдаланыңыз.
PARTNER_DIVISION_CHANGED=Бұл өтініш ашқаннан бері өзгерді. Қайта жүктеп, қайтадан қараңыз.
PARTNER_SUSPENDED_CANNOT_WITHDRAW=Тоқтатылған бөлімі бар серіктес аккаунтын жоя алмайды. Қолдау қызметіне хабарласыңыз.
OFFICE_CHANGE_REQUEST_NOT_FOUND=Кеңсені өзгерту сұранысы табылмады.
OFFICE_CHANGE_REQUEST_CHANGED=Бұл өзгерту сұранысы ашқаннан бері өзгерді. Қайта жүктеп, қайтадан қараңыз.
OFFICE_CHANGE_REQUEST_NOT_REVIEWABLE=Тек күтудегі өзгерту сұранысын ғана мақұлдауға немесе қабылдамауға болады.
OFFICE_CHANGE_DIVISION_NOT_APPROVED=Кеңсені өзгерту делдал бөлімі мақұлданған кезде ғана мақұлданады.
OFFICE_CHANGE_NOT_PENDING=Күтудегі өзгерту сұранысы жоқ.


LISTING_REPORT_REASON_REQUIRED=Шағымның себебін таңдаңыз.
LISTING_REPORT_DUPLICATE=Сіз бұл жарнамаға бұрын шағым жібердіңіз.
LISTING_REPORT_NOT_FOUND=Шағым табылмады.
LISTING_REPORT_ALREADY_HANDLED=Бұл шағым бұрын қаралған.
LISTING_NOT_BLOCKED=Бұл жарнама бұғатталмаған.
LISTING_NOT_BLOCKABLE=Бұл жарнама бұрын бұғатталған немесе аяқталған.
LISTING_NOT_RESERVED=Бұл жарнама брондалған деп белгіленбеген.
