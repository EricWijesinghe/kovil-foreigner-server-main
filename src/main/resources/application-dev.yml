spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 인증된 모든 요청이 Redis 를 한 번 탄다(토큰 취소 검사). 기본값(60초)이면 Valkey 가
      # 블랙홀이 되는 순간 톰캣 스레드가 60초씩 묶여 서버가 통째로 멈춘다 —
      # 같은 VPC 라 정상 지연은 수 ms 다. 빨리 포기하고 fail-open 으로 넘긴다.
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:kovil}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:your_username}
    password: ${DB_PASSWORD:your_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
